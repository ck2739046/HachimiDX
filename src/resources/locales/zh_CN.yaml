      ui_base_denominator_help: |
        程序解析音符间隔的时间分辨率。
        例如 32 代表单位时间为 1/32 小节，在 simai 语法中写作 "{32},"
        程序会将音符间隔对齐到单位时间。

        单位时间计算: 240000 / bpm / 分辨率 (ms)
        建议单位时间 ≥30ms，如果 BPM 较高，需要适当降低分辨率以保证准确性。
      ui_duration_denominator_label: "音符时值分辨率: "
      ui_duration_denominator_help: |
        程序解析音符时值的时间分辨率
        例如 32 代表单位时间为 1/32 小节，在 simai 语法中写作 "[32:x],"
        程序会将音符时值对齐到单位时间。

        单位时间计算: 240000 / bpm / 分辨率 (ms)
        建议单位时间 ≥30ms，如果 BPM 较高，需要适当降低分辨率以保证准确性。
        
        注: 此选项仅适用于 slide 和 touch-hold 音符的时值，
            hold 音符的时值的分辨率与“音符间隔分辨率”相同。

      ui_enable_standardize_label: "启用视频标准化模块: "
      ui_enable_standardize_help: |
        是否启用视频标准化模块。
        启用: 对选择的谱面确认视频进行标准化处理 (拉伸/裁剪/缩放/截取)
        禁用: 跳过此步骤，后续操作直接使用已有的标准化视频
      ui_enable_detect_label: "启用音符识别模块: "
      ui_enable_detect_help: |
        是否启用音符识别模块。
        启用: 对标准化后的视频进行音符识别
        禁用: 跳过此步骤，后续操作直接使用已有的音符识别结果
      ui_enable_analyze_label: "启用音符分析模块: "
      ui_enable_analyze_help: |
        是否启用音符分析模块。
        启用: 对音符识别结果进行分析，生成最终谱面
        禁用: 跳过此步骤

      ui_clear_output_button: "清空输出"
      ui_advanced_mode_label: "高级模式: "

      ui_low_fps_warning_title: "警告: 帧率过低"
      ui_low_fps_warning_text: |
        当前谱面等级为 %{level}。

        高等级谱面（Expert+）的音符流速通常较高，低帧率视频难以捕捉高速移动的音符，会严重影响自动识别的精度。

        强烈推荐使用 120 帧的视频，至少需要达到 60 帧才能获得可接受的识别效果。
        当前视频仅为 %{fps} 帧，可能导致识别结果不够准确。

        是否仍要继续？

      ui_reset_page_confirm_title: "重置确认"
      ui_reset_page_confirm_text: "当前已在自动抄谱页面（auto rechart）选择了谱面确认视频或谱面文件夹，确定要重置页面吗？所有输入内容将被清空。"
      ui_overwrite_bpm_confirm_title: "BPM 覆盖确认"
      ui_overwrite_bpm_confirm_text: "自动抄谱页面已设置 BPM（静态数值或动态配置），是否用新配置覆盖 BPM 设置？其他设置不受影响。"


