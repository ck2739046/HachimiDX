          正数：   从开头裁掉对应时长。
          负数：   在开头前添加一段静音/黑屏，使内容向后推迟。

          例: 2.0 → 丢弃原文件前 2 秒
             -1.5 → 开头多出 1.5 秒的静音/黑屏
        ui_trim_end_label: "截止时间: "
        ui_trim_end_help: |
