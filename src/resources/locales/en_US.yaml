    error_ffmpeg_not_found: "FFmpeg not found: %{path}"
    error_invalid_io_path: "Invalid input/output path: %{error}"
    error_failed_create_output_dir: "Failed to create output directory: %{error}"
    error_failed_remove_existing_output: "Failed to remove existing output file: %{error}"
    error_invalid_media_config: "Invalid media task config: %{error}"
    notice_ffmpeg_started: "FFmpeg started, command:\n%{command}"

  pydantic_models:
    run_ffmpeg:
      error_invalid_output_filename: "Invalid output filename: cannot contain characters: \\ / : * ? \" < > |"
      empty_output_extension: "Output file extension cannot be empty"
      invalid_output_extension: "Invalid output file extension: must start with '.'"
      ui_prompt_delete_existing_output_file: |
        Output file already exists: %{file_path}
        It will be deleted when the task starts.
        Continue?




  check_update:
    notice_checking: "Checking for updates..."
    notice_skipped: |
      "Check for updates daily" is disabled, skipping.
    notice_already_checked_today: "--Already checked for updates today, skipping."
    notice_is_latest: "--Already up to date (%{version})."
    notice_new_version: "--New version found: %{latest} (current %{current})"

    notice_network_error: "--Update check failed: network error"
    notice_fetch_failed: "--Update check failed: cannot fetch latest release (HTTP %{status}): %{error}"
    notice_parse_failed: "--Update check failed: cannot parse version: current [%{current}], latest [%{latest}]"
    notice_check_failed: "--Update check failed: %{error}"
    
    dialog_title: "Check Update"
    dialog_prompt: |
      HachimiDX Update Available!

      Current version: %{current_version}
      Latest version:  %{latest_version}
      
      Would you like to visit the download page?


