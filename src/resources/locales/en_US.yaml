      warning_convert_incomplete: "Post-conversion validation failed: %{backend}\n%{error}"
      warning_worker_start_failed: "Failed to start process\n%{error}"
      warning_cancel_failed: "Failed to cancel task\n%{error}"

      notice_save_success: "Settings saved successfully, some settings may require restarting the program to take effect"
      notice_save_failed: "Settings save failed"
      warning_refresh_failed: "Failed to reload configuration to memory: %{error}"
      notice_reset_success: "Settings reset to defaults, some settings may require restarting the program to take effect"
