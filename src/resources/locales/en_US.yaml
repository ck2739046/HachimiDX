        ui_params_divider: "Parameters"

        ui_reference_file_button: "Select Reference"
        ui_reference_file_help: "Audio or video file that contains the startup click sequence."
        ui_target_file_button: "Select Target"
        ui_target_file_help: "Audio or video file to match arcade timing."

        ui_bpm_label: "Initial BPM: "
        ui_bpm_help: "BPM value of startup click sequence"
        ui_click_count_label: "Click Count: "
        ui_click_count_help: "Number of startup clicks."
        ui_click_start_time_label: "Start Time: "
        ui_click_start_time_help: "Approximate click start time in the reference file."

        ui_run_button: "Analyze"
        ui_edit_target_button: "Modify Target"
        ui_video_align_button: "Retro-align Reference to Target"

        warning_reference_file_required: "Please select a reference file first."
        warning_target_file_required: "Please select a target file first."
        warning_no_audio_stream_ref: "Reference file: The selected file does not contain an audio stream. Please select a file with audio."
        warning_no_audio_stream_target: "Target file: The selected file does not contain an audio stream. Please select a file with audio."
        warning_invalid_bpm: "Invalid initial BPM value. Please input a number between 10 and 400."
        warning_invalid_click_start_time: "Invalid start time. Please input a number >= 0."
        warning_worker_start_failed: "Failed to start worker:\n%{error}"
        warning_run_failed: "Analyze failed."
        warning_wave_not_found: "Wave image file not found."
        warning_wave_load_failed: "Failed to load wave image."
        warning_offset_not_ready: "Offset is not ready yet. Please run Analyze first."
        warning_edit_target_failed: "Target edit failed:\n%{error}"
        warning_edit_target_failed_log: "Target edit failed."

        notice_run_start: "Start Arcade Timing Analyze..."
        notice_run_cancelled: "Analyze cancelled."
        notice_run_success: "Analyze completed."
        notice_edit_target_start: "Start target editing..."
        notice_edit_target_success: "Target editing completed.\nOutput file: %{output_path}"


      simply_align:
        dialog_title: "Simply Align"

        ui_reference_file_help: "Audio or video file used as the alignment reference."
        ui_target_file_help: "Audio or video file to align against the reference."

        ui_quick_export_divider: "Quick Export"
        ui_quick_trim_label: "Trim (ms): "
        ui_quick_delay_label: "Delay (ms): "
        ui_generate_video_label: " Generate MajdataView Reference Video: "
        ui_generate_video_button: "Generate"
        notice_video_generate_start: "Start generating reference video..."
        notice_video_generate_success: "Reference video generated.\nOutput file: %{output_path}"
        warning_negative_quick_offset: "Offset cannot be negative."
        warning_sync_file_exists: |
          Output file already exists:

          %{path}
          
          Confirm: Delete the existing file and regenerate it with the same filename.
          Cancel:  Keep the existing file and generate a new file with a numbered suffix (e.g., sync_1)
        warning_video_generate_failed: "Failed to generate reference video:\n%{error}"
        warning_video_generate_failed_log: "Failed to generate reference video."
        warning_offset_not_ready: "Offset is not ready yet. Please run Analyze first."
        notice_skip_zero_offset: "Offset is 0 ms, no editing is needed."
        warning_target_file_required: "Please select a target file first."
        warning_target_file_missing: "Target file does not exist. Please select it again."
        warning_build_output_path_failed: "Failed to build output path:\n%{error}"
        ui_offset_help: "This offset is derived from audio analysis. It is for reference only and may require manual adjustment."


      run_ffmpeg:
        
        ui_select_file_divider: "File Selection"
        ui_video_divider: "Video Stream"
        ui_audio_divider: "Audio Stream"
        ui_common_divider: "Common"

        # ---- Video Settings ----
        ui_video_quality_label: "Quality: "
        ui_video_quality_help: |
          Control the output video quality

          Lower values = higher quality, larger files.
        ui_video_resolution_label: "Resolution: "
        ui_video_resolution_help: |
          Sets output resolution

          original: keep original resolution.
          others: scale to fit while preserving aspect ratio, pad remaining space with black pixels.
        ui_video_fps_label: "FPS: "
        ui_video_fps_help: |
          Sets output frame rate

          original: keep original FPS.
        ui_video_gop_optimize_label: "Optimize GOP: "
        ui_video_gop_optimize_help: |
          Toggle GOP optimization

          When enabled, video playback in MajdataView will be significantly smoother.
          However, it will increase the output file size.
          Recommended only for videos that need to be played in MajdataView.
        ui_delete_audio_label: "Delete Audio: "
        ui_delete_audio_help: "If enabled, the output video will not contain an audio track."
        ui_delete_video_label: "Delete Video: "
        ui_delete_video_help: "If enabled, extracts the audio from the video and outputs an audio file (.ogg/.mp3)."
        
        # ---- Audio Settings ----
        ui_audio_format_label: "Codec: "
        ui_audio_format_help: Selects the audio codec
        ui_audio_bitrate_label: "Bitrate: "
        ui_audio_bitrate_help: |
          Controls the output audio quality

          Higher bitrate = higher quality, larger files.

          Note: These values use CBR (Constant Bitrate) encoding.
        ui_audio_sample_rate_label: "Sample Rate: "
        ui_audio_sample_rate_help: Sets output audio sampling rate
        ui_audio_volume_label: "Volume(%): "
        ui_audio_volume_help: |
          Adjusts output audio volume

          Adjust as percentage, range 0-200%,
          100% = original volume.

        # ---- Common Settings ----
        ui_adjust_start_label: "Start Time: "
        ui_adjust_start_help: |
          Controls the starting position of the output file.

          Unit:     Seconds (up to 3 decimal places, e.g. 1.5)
          Empty(0): No adjustment.
          Positive: Trim away the given duration from the beginning.
          Negative: Prepend a silent/black segment, shifting the content later.

          Example: 2.0 → Cuts off the first 2 seconds.
                  -1.5 → Adds 1.5s of silence or black frames at the start.
        ui_trim_end_label: "End Time: "
        ui_trim_end_help: |
          Controls the ending position of the output file.

          Unit:     Seconds (up to 3 decimal places, e.g. 50.5)
          Empty(0): Keep everything to the end.
          Positive: Discard content beyond this time (measured from the start).
          Negative: Discard content beyond this time (measured from the end).

          Example: For a 60-second file,
                   50 → Keeps the first 50 seconds only.
                  -10 → Keeps everything except the last 10 seconds (first 50 seconds).

        ui_clear_metadata_label: "Clear Metadata: "
        ui_clear_metadata_help: Whether to clear all metadata (e.g., title, author) in the output file
        ui_output_filename_label: "Output Filename: "
        ui_output_filename_help: |
          Sets the output file name.
          
          Filename only, do not include full file path or file extension.
        ui_submit_button: "Submit"
        ui_taskname_placeholder: "Input the task name (Optional)"

        # ---- Submit Button ----
        warning_task_submit_failed: "Task submit failed.\n\n%{error}"
        notice_task_submit_success: "Task submitted: %{task_id}"
        warning_unexpected_submit_error: "Unexpected error during task submission:\n%{error}"


      measure_bpm:
        dialog_title: "Measure BPM"

        ui_block1_divider: "Measure BPM"
        ui_enable_bpm_measurer_label: "Use BPM Measurer: "
        ui_select_config_button: "Select BPM Config"
        ui_select_config_help: "The timing_config.txt exported by Bpm-Measurer."
        ui_open_bpm_measurer_button: "Open BPM Measurer"
        ui_manual_mode_hint: " Please select the BPM config file below"

        ui_block2_divider: "Compute Offset"
        ui_first_note_time_label: "First note time: "
        ui_first_note_time_help: |
          Time of the first note (milliseconds):
            tap/hold/slide: just reaches the judgement line
            touch/touch-hold: just converges at the center

          If you don't know the exact time, run Auto Rechart;
          the output at the bottom of the page will contain "first note appear at <xxx> ms".
          Copy that time and paste it here.
        ui_beat_index_label: "Beat index: "
        ui_beat_index_help: The beat_index value of the note in the bpm config.

        ui_update_timing_config_button: "Compute & Export"
        ui_send_to_auto_rechart_button: "Send to Auto Rechart Page"

        warning_bpm_measurer_start_failed: "Failed to start Bpm-Measurer:\n%{error}"
        warning_bpm_measurer_failed: "Bpm-Measurer exited unexpectedly (exit code %{code})."
        warning_manifest_missing: "Bpm-Measurer export manifest not found. Please select the config manually."
        warning_manifest_read_failed: "Failed to read Bpm-Measurer export manifest:\n%{error}"
        warning_compute_prerequisite: "Please select a BPM config and fill in the first note time and beat index first."
        warning_first_note_invalid: "Invalid first note time. Please enter a number (milliseconds)."
        warning_beat_index_invalid: "Invalid beat index. Please enter a number."
        warning_compute_failed: "Compute or export failed:\n%{error}"

        notice_bpm_measurer_start: "Bpm-Measurer started. Please measure and export the config there…"
        notice_bpm_measurer_cancelled: "Bpm-Measurer was closed without exporting."
        notice_bpm_measurer_success: "Config auto-filled from Bpm-Measurer."
        notice_compute_success: "Aligned BPM config exported:\n%{output_path}"


    # ---- majdata page ----

    majdata_page:
      ui_select_song_button: "Select Song"
      ui_song_help: |
        Program will look for three types of files:

        1. Chart files (*.txt)
        2. Audio files (*.mp3, *.ogg)
        3. Video files (*.mp4)

        To clear the bottom-left video player,
        select the "---" option in the first dropdown menu on the right,
        then click the "Load" button.
      ui_play_video_help: |
        checked: The video will play in both the top-left MajdataView
                 and the bottom-left video player.
        unchecked: The video will only play in the bottom-left video player.




    # ---- auto rechart 页面 ----

    auto_rechart_page:
      ui_select_file_divider: "File Selection"
      ui_standardize_divider: "Standardize Video"
      ui_detect_divider: "Note Detection"
      ui_analyze_divider: "Note Analysis"
      ui_common_divider: "Common"

      ui_select_chart_confirm_video_button: "Select Chart Confirmation"
      ui_selected_output_dir_button: "Select folder"
      ui_selected_output_dir_help: |
        The selected folder <may> need to contain the following files:
        - <folder_name>_std.mp4
        - detect_result.txt
        - track_result.txt
        - preprocess_result.txt

      ui_song_name_label: "Song Name: "
      ui_video_mode_label: "Video Mode: "
      ui_video_mode_source_tooltip: "native in-game footage"
      ui_video_mode_camera_tooltip: "camera directly filming the arcade screen"
      ui_need_screen_rectification_label: " Screen Rectification: "
      ui_need_screen_rectification_help: |
        Expected input: camera facing the screen directly, with content centered 
        and filling the entire frame.

        If your input video does not meet these criteria, enable this option to 
        access manual screen rectification controls.

        If your input is already properly aligned, leave this option unchecked.

      ui_start_sec_label: "Start Time: "
      ui_start_sec_help: |
        Controls the starting position of the output file.

        Unit:     Seconds (up to 3 decimal places, e.g. 2.5)
        Empty(0): Start from the beginning.
        Positive: Trim away the given duration from the beginning.

        Example: 2.5 → Cuts off the first 2.5 seconds.

      ui_skip_detect_label: "Skip Detect: "
      ui_skip_detect_help: "Skip frame-by-frame note detection and directly read the existing detection result (detect_result.txt)."
      ui_skip_cls_label: "Skip Classify: "
      ui_skip_cls_help: "Skip note classification: ex, break, ex-break."
      ui_skip_export_tracked_label: "Skip Export Tracked Video: "
      ui_skip_export_tracked_help: "Skip exporting the video with note tracking overlays."

      # ui_enable_reid_label: "Enable ReID: "
      # ui_enable_reid_help: |
      #   Enable appearance Re-Identification (ReID) to assist tracking HOLD notes.
      #   Enabling this option can improve the stability and accuracy of tracking, but it will significantly increase the tracking time.
      #   Recommended to enable only for videos with 30/60 FPS.

      ui_bpm_type_label: "BPM Type: "
      ui_bpm_type_static: "Static"
      ui_bpm_type_dynamic: "Dynamic"
      ui_input_static_bpm_label: " Input Static BPM: "
      ui_static_bpm_help: "Only static BPM is supported (no tempo changes).\nSupports integers or up to 3 decimal places"
      ui_is_big_touch_label: " Larger Touch: "
      ui_is_big_touch_help: |
        In Basic/Advanced level,
        touch/touch-hold notes are usually larger in size.
      ui_chart_lv_label: "Chart Level: "
      ui_chart_lv_2_tooltip: "Basic"
      ui_chart_lv_3_tooltip: "Advanced"
      ui_chart_lv_4_tooltip: "Expert"
      ui_chart_lv_5_tooltip: "Master"
      ui_chart_lv_6_tooltip: "Re:Master"
      ui_chart_lv_7_tooltip: "Utage"
      ui_base_denominator_16_tooltip: "Supports 12th"
      ui_base_denominator_32_tooltip: "Supports 12th & 24th"
      ui_base_denominator_64_tooltip: "Full 12th & 24th support; only 1/48th supported"
      ui_base_denominator_label: "Base Denominator: "
      ui_base_denominator_help: |
        Time resolution used to parse note intervals.
        For example, 32 means one unit is 1/32 beat, written as "{32}," in simai syntax.
        The program aligns note intervals to this time unit.

        Unit time calculation: 240000 / bpm / denominator (ms)
        Recommended unit time is >=30ms. If BPM is high, lower the denominator for better accuracy.
      ui_duration_denominator_label: "Duration Denominator: "
      ui_duration_denominator_help: |
        Time resolution used to parse note durations.
        For example, 32 means one unit is 1/32 beat, written as "[32:x]," in simai syntax.
        The program aligns note durations to this time unit.

        Unit time calculation: 240000 / bpm / denominator (ms)
        Recommended unit time is >=30ms. If BPM is high, lower the denominator for better accuracy.

        Note: This option only applies to slide and touch-hold durations.
              Hold duration uses the same denominator as "Base Denominator".

      ui_enable_standardize_label: "Enable Video Standardization: "
      ui_enable_standardize_help: |
        Whether to enable the video standardization module.
        Enabled: standardize the selected chart confirmation video (stretch/crop/scale/trim)
        Disabled: skip this step and use the existing standardized video directly
      ui_enable_detect_label: "Enable Note Detection: "
      ui_enable_detect_help: |
        Whether to enable the note detection module.
        Enabled: run note detection on the standardized video
        Disabled: skip this step and use existing note detection results directly
      ui_enable_analyze_label: "Enable Note Analysis: "
      ui_enable_analyze_help: |
        Whether to enable the note analysis module.
        Enabled: analyze note detection results and generate the final chart
        Disabled: skip this step

      ui_clear_output_button: "Clear Output"
      ui_advanced_mode_label: "Advanced Mode: "

      ui_low_fps_warning_title: "Warning: FPS too low"
      ui_low_fps_warning_text: |
        The current chart is Level %{level}.

        High-level charts (Expert+) usually have high note speeds, low-FPS videos struggle to capture fast-moving notes, severely affecting auto-detection accuracy.

        120fps is strongly recommended, and at least 60fps is required to achieve acceptable auto-detection results.
        Your video is only %{fps} fps, which may result in poor accuracy.

        Continue anyway?

      ui_reset_page_confirm_title: "Reset Confirmation"
      ui_reset_page_confirm_text: "A chart confirmation video or chart folder is currently selected in the Auto Rechart page. Are you sure you want to reset the page? All inputs will be cleared."
      ui_overwrite_bpm_confirm_title: "Overwrite BPM"
      ui_overwrite_bpm_confirm_text: "The Auto Rechart page already has a BPM set (static value or dynamic config). Overwrite the BPM setting with the new config? Other settings are not affected."


